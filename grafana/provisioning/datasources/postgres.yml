apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: jira-metrics-postgres
    type: postgres
    access: proxy
    isDefault: true
    url: ${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}
    user: ${DATABASE_USER:-postgres}
    database: ${DATABASE_NAME:-metrics}
    version: 16
    secureJsonData:
      password: ${DATABASE_PASSWORD:-postgres}
    jsonData:
      sslmode: disable
      maxOpenConns: 50
      maxIdleConns: 25
      connMaxLifetime: 14400
      maxIdleConnsAuto: true
      postgresVersion: 1500
      timescaledb: false
