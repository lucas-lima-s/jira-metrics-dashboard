[project]
name = "jira-metrics"
version = "1.0.0"
description = "Collect Jira issues into PostgreSQL and visualise delivery metrics in Grafana"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "sqlalchemy>=2.0.43",
  "alembic>=1.16.5",
  "pydantic>=2.11.9",
  "psycopg[binary]>=3.2",
  "requests>=2.32.5",
  "python-dotenv>=1.1.1",
]

[project.scripts]
jira-metrics = "jira_metrics.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "debugpy>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_metrics"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
